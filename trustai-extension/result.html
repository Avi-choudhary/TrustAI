<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrustAI — Result</title>
  <link rel="stylesheet" href="result.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon32.png" alt="" />
        <span>TrustAI</span>
      </div>
      <a id="settingsLink" href="options.html" target="_blank">Settings</a>
    </header>

    <main id="content" class="content">
      <div id="loadingState" class="state">
        <div class="spinner"></div>
        <p id="loadingText">Uploading and analyzing…</p>
      </div>

      <div id="errorState" class="state hidden">
        <div class="error-icon">!</div>
        <p id="errorText"></p>
        <button id="retryBtn" class="btn">Try again</button>
      </div>

      <div id="resultState" class="hidden">
        <section class="risk-card">
          <div id="riskBadge" class="risk-badge">
            <span id="riskScoreNum">--</span>
          </div>
          <div class="risk-meta">
            <div id="riskLabel" class="risk-label">—</div>
            <div id="riskSub" class="risk-sub">—</div>
            <div id="fileName" class="file-name"></div>
          </div>
        </section>

        <section id="previewSection" class="preview-section hidden">
          <img id="previewImg" alt="Preview" />
        </section>

        <section class="signals-section">
          <h2>Signals</h2>
          <div id="signalsList" class="signals-list"></div>
        </section>

        <section id="verdictSection" class="verdict-section hidden">
          <h2>Document verdict</h2>
          <div id="verdictBody"></div>
        </section>
      </div>
    </main>
  </div>

  <script src="shared.js"></script>
  <script src="result.js"></script>
</body>
</html>
